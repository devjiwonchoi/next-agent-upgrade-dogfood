name: Build & Package

# Stable tag-release workflow.
#
# Triggers on `v*` tags → builds macOS arm64/x64 bootstrap assets plus one
# universal updater ZIP, an unsigned Windows NSIS updater, and Linux manual
# installers, then creates a real GitHub Release (NOT a prerelease) whose body
# is RELEASE_NOTES.md. macOS and Windows receive updater metadata/provenance;
# Linux remains a manual download.
# The internal tester channel lives in `preview-build.yml` / `preview-release.yml`
# (artifacts-only / prerelease) and has its own signed `preview*.yml` feed.
#
# Fail-closed gates preserved from the refactor's CI:
#   - package.json version == tag version
#   - Codex app-server must NOT use `--listen`
#   - ClaudeCode canonicalizes bare `sonnet` -> `claude-sonnet-4-6`
#   - P0 startup regression pins (codex binary discovery, app-server client
#     fast-fail, provider resolver / catalog)
#   - packaged better-sqlite3 native ABI loads under the Electron runtime
#   - every packaged standalone server boots and contains no source maps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform (Windows auto-updates unsigned when no optional signer is configured)"
        required: true
        default: "macos"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      telemetry_smoke:
        description: "Compile and run isolated Sentry smoke fixtures (manual macOS only)"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve expected version (tag on push, package.json otherwise)
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Expected release version: $VERSION"

      - name: Fail-closed gate A — version matches tag + Codex has no --listen
        env:
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::stable tags must match vX.Y.Z; prerelease tags belong to preview-release.yml"
            exit 1
          fi
          # Match an actual CLI-arg literal ('--listen' / "--listen"), NOT prose
          # comments that merely mention the removed flag (e.g. a backtick `--listen`).
          if grep -REn "['\"]--listen['\"]" src/lib/codex/app-server-manager.ts; then
            echo "::error::Codex app-server still passes --listen as a CLI arg"
            exit 1
          fi
          node -e '
            const v = require("./package.json").version;
            if (v !== process.env.EXPECTED_VERSION) {
              console.error(`::error::package.json version ${v} != tag/expected ${process.env.EXPECTED_VERSION}`);
              process.exit(1);
            }
            console.log(`✓ package version ${v}`);
          '

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Fail-closed gate B — ClaudeCode canonicalizes bare sonnet
        run: |
          set -euo pipefail
          trap 'rm -f release-gate-sonnet.ts' EXIT
          cat > release-gate-sonnet.ts <<'TS'
          import { toClaudeCodeEnv } from './src/lib/provider-resolver';
          const resolved: any = {
            provider: {
              id: 'gate',
              name: 'Legacy Gateway',
              provider_type: 'anthropic',
              protocol: 'anthropic',
              base_url: 'https://gateway.example.com/anthropic',
              api_key: 'key',
              is_active: 1,
              sort_order: 0,
              extra_env: '{}',
              headers_json: '{}',
              env_overrides_json: '',
              role_models_json: JSON.stringify({ default: 'sonnet', sonnet: 'sonnet', haiku: 'haiku', opus: 'opus' }),
              notes: '',
              created_at: '',
              updated_at: '',
              options_json: '{}',
            },
            protocol: 'anthropic',
            authStyle: 'api_key',
            model: 'sonnet',
            upstreamModel: 'claude-sonnet-4-6',
            modelDisplayName: 'Sonnet 4.6',
            headers: {},
            envOverrides: {},
            roleModels: { default: 'sonnet', sonnet: 'sonnet', haiku: 'haiku', opus: 'opus' },
            hasCredentials: true,
            availableModels: [
              { modelId: 'sonnet', upstreamModelId: 'claude-sonnet-4-6', displayName: 'Sonnet 4.6' },
              { modelId: 'haiku', upstreamModelId: 'claude-haiku-4-5-20251001', displayName: 'Haiku 4.5' },
              { modelId: 'opus', upstreamModelId: 'claude-opus-4-7', displayName: 'Opus 4.7' },
            ],
            settingSources: ['user'],
          };
          const env = toClaudeCodeEnv({}, resolved);
          if (env.ANTHROPIC_MODEL !== 'claude-sonnet-4-6') {
            console.error(`::error::expected claude-sonnet-4-6, got ${env.ANTHROPIC_MODEL}`);
            process.exit(1);
          }
          console.log(`✓ sonnet -> ${env.ANTHROPIC_MODEL}`);
          TS
          CODEX_DISABLED=1 npx tsx release-gate-sonnet.ts

      - name: P0 regression pins
        run: |
          CODEX_DISABLED=1 npx tsx --test --import ./src/__tests__/db-isolation.setup.ts \
            src/__tests__/unit/codex-binary-discovery.test.ts \
            src/__tests__/unit/codex-app-server-client.test.ts \
            src/__tests__/unit/provider-resolver.test.ts

      # Full unit + lint coverage is enforced by the local pre-commit hook on the
      # tagged commit. The release CI keeps the remote gate focused on version
      # identity + P0 startup regressions + packaged ABI so a tag build can't be
      # blocked by unrelated Linux-runner test hangs or React-compiler lint debt.

  build-macos:
    needs: verify-source
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build macOS release bundles
        timeout-minutes: 45
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CODEPILOT_APP_CHANNEL: stable
          CODEPILOT_OFFICIAL_UPDATE_BUILD: "1"
          CODEPILOT_SOURCE_MAPS: "1"
          CODEPILOT_TELEMETRY_SMOKE: ${{ inputs.telemetry_smoke && '1' || '0' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run electron:build

      - name: Upload macOS source maps to Sentry
        env:
          CODEPILOT_APP_CHANNEL: stable
          CODEPILOT_OFFICIAL_UPDATE_BUILD: "1"
          CODEPILOT_SOURCE_MAPS: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npm run sentry:sourcemaps:upload

      - name: Configure fail-closed Apple notarization credentials
        env:
          APPLE_NOTARIZATION_KEY_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          [ -n "$APPLE_NOTARIZATION_KEY_BASE64" ] || { echo "::error::APPLE_NOTARIZATION_KEY_BASE64 is required"; exit 1; }
          [ -n "$NOTARY_KEY_ID" ] || { echo "::error::APPLE_API_KEY_ID is required"; exit 1; }
          [ -n "$NOTARY_ISSUER" ] || { echo "::error::APPLE_API_ISSUER is required"; exit 1; }
          KEY_PATH="$RUNNER_TEMP/AuthKey_CodePilot.p8"
          printf '%s' "$APPLE_NOTARIZATION_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$NOTARY_ISSUER" >> "$GITHUB_ENV"

      - name: Package native macOS manual assets (arm64 + x64)
        timeout-minutes: 45
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CODEPILOT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODEPILOT_REQUIRE_DEVELOPER_ID: "1"
        run: |
          npx electron-builder --mac --arm64 --x64 --config electron-builder.yml --publish never

      - name: Package universal macOS updater asset
        timeout-minutes: 45
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          CODEPILOT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODEPILOT_REQUIRE_DEVELOPER_ID: "1"
        run: |
          # A separately generated universal ZIP becomes latest-mac.yml's
          # single feed target. The first command keeps native DMGs for manual
          # arm64/x64 bootstrap; the second overwrites metadata with builder-
          # generated universal metadata without hand-editing YAML.
          npx electron-builder --mac --universal --config electron-builder.yml --publish never

      - name: Notarize and staple final macOS DMGs
        timeout-minutes: 45
        env:
          CODEPILOT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/notarize-macos-dmgs.mjs release 3

      - name: Verify packaged version, native ABI, and server startup
        env:
          CODEPILOT_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPECTED_VERSION: ${{ needs.verify-source.outputs.version }}
        run: |
          set -euo pipefail
          # Both arch DMGs must exist and carry the version in their names.
          for ARCH in arm64 x64; do
            DMG=$(find release -name "CodePilot-*-${ARCH}.dmg" | head -1)
            [ -n "$DMG" ] || { echo "::error::no ${ARCH} DMG produced"; exit 1; }
            case "$DMG" in *"$EXPECTED_VERSION"*) ;; *) echo "::error::${ARCH} DMG name lacks $EXPECTED_VERSION"; exit 1 ;; esac
            echo "✓ ${ARCH} DMG: $DMG"
          done
          node scripts/verify-macos-developer-id.mjs release 3
          node scripts/verify-macos-notarization.mjs release 3
          # Full ABI load check on the runner-native arm64 .app. Cross-arch exec
          # of the x64 binary is not reliable on an Apple-Silicon runner, so the
          # x64 DMG is verified structurally (existence + version) above.
          APP=$(find release -maxdepth 4 -path "*mac-arm64*" -name "CodePilot.app" -type d | head -1)
          [ -n "$APP" ] || APP=$(find release -maxdepth 4 -name "CodePilot.app" -type d | head -1)
          [ -n "$APP" ] || { echo "::error::CodePilot.app not found"; exit 1; }
          PLIST_VER=$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")
          [ "$PLIST_VER" = "$EXPECTED_VERSION" ] || { echo "::error::Info.plist $PLIST_VER != $EXPECTED_VERSION"; exit 1; }
          SQLITE=$(find "$APP/Contents/Resources" -path "*better-sqlite3*" -name "*.node" | head -1)
          [ -n "$SQLITE" ] || { echo "::error::better-sqlite3 .node not found"; exit 1; }
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/CodePilot" -e "const path = require('node:path'); require(path.resolve(process.argv[1])); console.log('better-sqlite3 OK, ABI=' + process.versions.modules)" "$SQLITE"
          node scripts/verify-packaged-server.mjs "$APP/Contents/MacOS/CodePilot" "$APP/Contents/Resources"
          node scripts/verify-electron-main-health.mjs "$APP/Contents/MacOS/CodePilot"

      - name: Run packaged Sentry synthetic events
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telemetry_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find release -maxdepth 4 -path "*mac-arm64*" -name "CodePilot.app" -type d | head -1)
          [ -n "$APP" ] || APP=$(find release -maxdepth 4 -name "CodePilot.app" -type d | head -1)
          [ -n "$APP" ] || { echo "::error::CodePilot.app not found for telemetry smoke"; exit 1; }
          LOG="$RUNNER_TEMP/codepilot-telemetry-smoke.log"
          "$APP/Contents/MacOS/CodePilot" >"$LOG" 2>&1 &
          APP_PID=$!
          for _ in $(seq 1 45); do
            if grep -q "layer=next_server" "$LOG" && grep -q "layer=electron_main" "$LOG"; then
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::packaged telemetry smoke app exited early"
              tail -80 "$LOG"
              exit 1
            fi
            sleep 1
          done
          grep -q "layer=next_server" "$LOG" || { echo "::error::Next server smoke event missing"; tail -80 "$LOG"; exit 1; }
          grep -q "layer=electron_main" "$LOG" || { echo "::error::Electron main smoke event missing"; tail -80 "$LOG"; exit 1; }
          sleep 8
          kill "$APP_PID" 2>/dev/null || true
          wait "$APP_PID" 2>/dev/null || true
          echo "Packaged JS telemetry smoke emitted; renderer delivery is verified in Sentry"

      - name: Run packaged Sentry native crash fixture
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telemetry_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find release -maxdepth 4 -path "*mac-arm64*" -name "CodePilot.app" -type d | head -1)
          [ -n "$APP" ] || APP=$(find release -maxdepth 4 -name "CodePilot.app" -type d | head -1)
          [ -n "$APP" ] || { echo "::error::CodePilot.app not found for native crash smoke"; exit 1; }
          LOG="$RUNNER_TEMP/codepilot-native-crash-smoke.log"
          set +e
          CODEPILOT_NATIVE_CRASH_SMOKE=1 "$APP/Contents/MacOS/CodePilot" >"$LOG" 2>&1
          STATUS=$?
          set -e
          [ "$STATUS" -ne 0 ] || { echo "::error::native crash fixture exited successfully"; exit 1; }
          grep -q "native crash fixture armed" "$LOG" || { echo "::error::native crash fixture did not arm"; tail -80 "$LOG"; exit 1; }
          # SentryMinidump deliberately sets Electron crashReporter uploadToServer=false;
          # the SDK reads and uploads completed Crashpad dumps on the next app start.
          # Relaunch without the runtime crash flag so the pending dump can drain.
          RECOVERY_LOG="$RUNNER_TEMP/codepilot-native-crash-recovery.log"
          "$APP/Contents/MacOS/CodePilot" >"$RECOVERY_LOG" 2>&1 &
          RECOVERY_PID=$!
          for _ in $(seq 1 20); do
            if grep -q "layer=electron_main" "$RECOVERY_LOG"; then
              break
            fi
            if ! kill -0 "$RECOVERY_PID" 2>/dev/null; then
              echo "::error::native crash recovery launch exited early"
              tail -80 "$RECOVERY_LOG"
              exit 1
            fi
            sleep 1
          done
          grep -q "layer=electron_main" "$RECOVERY_LOG" || { echo "::error::Sentry did not initialize on native crash recovery launch"; tail -80 "$RECOVERY_LOG"; exit 1; }
          sleep 20
          kill "$RECOVERY_PID" 2>/dev/null || true
          wait "$RECOVERY_PID" 2>/dev/null || true
          echo "Native crash fixture exited with expected non-zero status $STATUS; recovery launch drained pending minidumps"

      - name: Checksums
        run: |
          cd release
          find . -maxdepth 1 -type f \( -name 'CodePilot-*.dmg' -o -name 'CodePilot-*.zip' -o -name '*.blockmap' -o -name 'latest-mac.yml' \) -print0 \
            | sort -z | xargs -0 shasum -a 256 | tee checksums-macos.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.telemetry_smoke) }}
        with:
          name: release-macos
          path: |
            release/CodePilot-*.dmg
            release/CodePilot-*.zip
            release/CodePilot-*.blockmap
            release/latest-mac.yml
            release/checksums-macos.sha256
          retention-days: 7

  build-windows:
    needs: verify-source
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    # Pinned to windows-2022 (VS 2022 / MSVC v17). `windows-latest` rolled to a
    # VS 18 image whose toolchain the bundled node-gyp can't detect ("unknown
    # version undefined"), breaking native builds (zlib-sync / better-sqlite3)
    # at `npm ci`. See v0.56.1 release failure.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Windows release bundles
        timeout-minutes: 35
        env:
          CODEPILOT_APP_CHANNEL: stable
          CODEPILOT_OFFICIAL_UPDATE_BUILD: "1"
          CODEPILOT_SOURCE_MAPS: "1"
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run electron:build

      - name: Upload Windows source maps to Sentry
        env:
          CODEPILOT_APP_CHANNEL: stable
          CODEPILOT_OFFICIAL_UPDATE_BUILD: "1"
          CODEPILOT_SOURCE_MAPS: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npm run sentry:sourcemaps:upload

      - name: Resolve optional Windows signing mode
        id: windows-signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $configuredCount = 0
          foreach ($value in @($env:WINDOWS_CERT_PFX_BASE64, $env:WINDOWS_CERT_PASSWORD, $env:WINDOWS_PUBLISHER_SUBJECT)) {
            if (-not [string]::IsNullOrWhiteSpace($value)) { $configuredCount += 1 }
          }
          if ($configuredCount -eq 0) {
            'mode=unsigned' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'Windows signer is not configured; producing the official unsigned updater installer under the GitHub single-trust-root policy.'
            exit 0
          }
          if ($configuredCount -ne 3) {
            throw 'Windows signer is partially configured; provide WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD, and WINDOWS_PUBLISHER_SUBJECT together or remove all three'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'codepilot-windows-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          "WIN_CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CODEPILOT_WINDOWS_PUBLISHER_SUBJECT=$($env:WINDOWS_PUBLISHER_SUBJECT)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'mode=signed' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package Windows x64
        timeout-minutes: 35
        shell: pwsh
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $builderArgs = @('electron-builder', '--win', '--x64', '--config', 'electron-builder.yml', '--publish', 'never')
          if ('${{ steps.windows-signing.outputs.mode }}' -eq 'unsigned') {
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
            $builderArgs += '--config.win.forceCodeSigning=false'
            $builderArgs += '--config.win.verifyUpdateCodeSignature=false'
          }
          & npx @builderArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged version, native ABI, and server startup
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.verify-source.outputs.version }}
        run: |
          set -euo pipefail
          EXE=$(find release -name "CodePilot.Setup.*.exe" | head -1)
          [ -n "$EXE" ] || { echo "::error::no NSIS installer produced"; exit 1; }
          case "$EXE" in *"$EXPECTED_VERSION"*) ;; *) echo "::error::installer name lacks $EXPECTED_VERSION"; exit 1 ;; esac
          SQLITE=$(find release/win-unpacked -path "*better-sqlite3*" -name "*.node" 2>/dev/null | head -1)
          [ -n "$SQLITE" ] || { echo "::error::better-sqlite3 .node not found"; exit 1; }
          BIN=$(find release/win-unpacked -maxdepth 1 -name "CodePilot.exe" | head -1)
          ELECTRON_RUN_AS_NODE=1 "$BIN" -e "const path = require('node:path'); require(path.resolve(process.argv[1])); console.log('better-sqlite3 OK, ABI=' + process.versions.modules)" "$SQLITE"
          node scripts/verify-packaged-server.mjs "$BIN" "$(dirname "$BIN")/resources"
          node scripts/verify-electron-main-health.mjs "$BIN"

      - name: Verify Authenticode publisher and RFC3161 timestamp
        if: ${{ steps.windows-signing.outputs.mode == 'signed' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/verify-windows-signing.ps1 -ReleaseRoot release -ExpectedSubject $env:CODEPILOT_WINDOWS_PUBLISHER_SUBJECT
          $appUpdate = Join-Path $PWD 'release/win-unpacked/resources/app-update.yml'
          if (-not (Test-Path $appUpdate -PathType Leaf)) { throw 'app-update.yml is missing from the signed Windows package' }
          if ((Get-Content $appUpdate -Raw) -notmatch '(?m)^\s*publisherName\s*:') {
            throw 'Signed Windows app-update.yml must expose publisherName for runtime Authenticode breadcrumb verification'
          }

      - name: Verify unsigned updater package makes no Authenticode publisher claim
        if: ${{ steps.windows-signing.outputs.mode == 'unsigned' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem release -Filter 'CodePilot.Setup.*.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer, found $($installers.Count)" }
          $unpackedExe = Join-Path $PWD 'release/win-unpacked/CodePilot.exe'
          if (-not (Test-Path $unpackedExe -PathType Leaf)) { throw 'Unpacked CodePilot.exe is missing' }
          $targets = @($installers[0].FullName, $unpackedExe)
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -FilePath $target
            if ($signature.Status -ne 'NotSigned') { throw "$target unexpectedly reports Authenticode status $($signature.Status)" }
          }
          $appUpdate = Join-Path $PWD 'release/win-unpacked/resources/app-update.yml'
          if (-not (Test-Path $appUpdate -PathType Leaf)) { throw 'app-update.yml is missing from the official Windows package' }
          if ((Get-Content $appUpdate -Raw) -match '(?m)^\s*publisherName\s*:') {
            throw 'Unsigned Windows app-update.yml must not claim an Authenticode publisherName'
          }
          $metadata = @(Get-ChildItem release -Filter 'latest.yml')
          $blockmaps = @(Get-ChildItem release -Filter 'CodePilot.Setup.*.exe.blockmap')
          if ($metadata.Count -ne 1) { throw "Expected one latest.yml, found $($metadata.Count)" }
          if ($blockmaps.Count -ne 1) { throw "Expected one NSIS blockmap, found $($blockmaps.Count)" }
          Write-Host 'Verified Windows updater is explicitly unsigned, carries official provenance, and makes no publisher identity claim.'

      - name: Checksums
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f \( -name 'CodePilot.Setup.*.exe' -o -name 'CodePilot.Setup.*.exe.blockmap' -o -name 'latest.yml' \) -print0 \
            | sort -z | xargs -0 sha256sum | tee checksums-windows.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: |
            release/CodePilot.Setup.*.exe
            release/CodePilot.Setup.*.exe.blockmap
            release/latest.yml
            release/checksums-windows.sha256
          retention-days: 7

  build-linux:
    needs: verify-source
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            deb_arch: amd64
            rpm_arch: x86_64
            file_arch: x86-64
          - arch: arm64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
            file_arch: ARM aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install RPM packaging support
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      - name: Build Linux release bundle
        timeout-minutes: 35
        env:
          CODEPILOT_APP_CHANNEL: stable
          CODEPILOT_OFFICIAL_UPDATE_BUILD: "0"
          CODEPILOT_SOURCE_MAPS: "1"
          CODEPILOT_TELEMETRY_SMOKE: "0"
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run electron:build

      - name: Upload Linux source maps to Sentry
        env:
          CODEPILOT_APP_CHANNEL: stable
          CODEPILOT_OFFICIAL_UPDATE_BUILD: "0"
          CODEPILOT_SOURCE_MAPS: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: npm run sentry:sourcemaps:upload

      - name: Package Linux ${{ matrix.arch }}
        timeout-minutes: 35
        run: npx electron-builder --linux --${{ matrix.arch }} --config electron-builder.yml --publish never

      - name: Verify Linux package architecture, native ABI, and server startup
        env:
          EXPECTED_VERSION: ${{ needs.verify-source.outputs.version }}
          EXPECTED_DEB_ARCH: ${{ matrix.deb_arch }}
          EXPECTED_RPM_ARCH: ${{ matrix.rpm_arch }}
          EXPECTED_FILE_ARCH: ${{ matrix.file_arch }}
        run: |
          set -euo pipefail
          APPIMAGE=$(find release -maxdepth 1 -name "CodePilot-*.AppImage" | head -1)
          DEB=$(find release -maxdepth 1 -name "CodePilot-*.deb" | head -1)
          RPM=$(find release -maxdepth 1 -name "CodePilot-*.rpm" | head -1)
          for PACKAGE in "$APPIMAGE" "$DEB" "$RPM"; do
            [ -n "$PACKAGE" ] || { echo "::error::missing Linux package"; exit 1; }
            case "$PACKAGE" in *"$EXPECTED_VERSION"*) ;; *) echo "::error::$PACKAGE lacks version $EXPECTED_VERSION"; exit 1 ;; esac
          done
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "$EXPECTED_DEB_ARCH" ] || {
            echo "::error::DEB architecture does not match $EXPECTED_DEB_ARCH"
            exit 1
          }
          [ "$(rpm -qp --qf '%{ARCH}' "$RPM")" = "$EXPECTED_RPM_ARCH" ] || {
            echo "::error::RPM architecture does not match $EXPECTED_RPM_ARCH"
            exit 1
          }
          UNPACKED=$(find release -maxdepth 1 -type d -name "linux*unpacked" | head -1)
          [ -n "$UNPACKED" ] || { echo "::error::Linux unpacked app not found"; exit 1; }
          BIN="$UNPACKED/codepilot"
          [ -x "$BIN" ] || BIN="$UNPACKED/CodePilot"
          [ -x "$BIN" ] || { echo "::error::CodePilot Linux executable not found"; exit 1; }
          file "$BIN" | grep -F "$EXPECTED_FILE_ARCH" || {
            echo "::error::Linux executable architecture does not match $EXPECTED_FILE_ARCH"
            file "$BIN"
            exit 1
          }
          SQLITE=$(find "$UNPACKED/resources" -path "*better-sqlite3*" -name "*.node" | head -1)
          [ -n "$SQLITE" ] || { echo "::error::better-sqlite3 .node not found"; exit 1; }
          ELECTRON_RUN_AS_NODE=1 "$BIN" -e "const path = require('node:path'); require(path.resolve(process.argv[1])); console.log('better-sqlite3 OK, ABI=' + process.versions.modules)" "$SQLITE"
          node scripts/verify-packaged-server.mjs "$BIN" "$UNPACKED/resources"
          xvfb-run -a node scripts/verify-electron-main-health.mjs "$BIN"
          echo "Linux build baseline: $(getconf GNU_LIBC_VERSION)"

      - name: Checksums
        run: |
          cd release
          find . -maxdepth 1 -type f \( -name 'CodePilot-*.AppImage' -o -name 'CodePilot-*.deb' -o -name 'CodePilot-*.rpm' \) -print0 \
            | sort -z | xargs -0 sha256sum | tee "checksums-linux-${{ matrix.arch }}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            release/CodePilot-*.AppImage
            release/CodePilot-*.deb
            release/CodePilot-*.rpm
            release/checksums-linux-${{ matrix.arch }}.sha256
          retention-days: 7

  verify-macos-intel-abi:
    needs: build-macos
    if: ${{ (github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos') && !(github.event_name == 'workflow_dispatch' && inputs.telemetry_smoke) }}
    # GitHub's architecture-explicit Intel image is required here: executing
    # the universal updater ZIP proves its x64 slice and native modules on real
    # Intel hardware instead of treating cross-build structure as ABI proof.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macos
          path: artifacts

      - name: Launch universal updater asset on Intel and load SQLite
        run: |
          set -euo pipefail
          ZIP=$(find artifacts -maxdepth 1 -name 'CodePilot-*-universal.zip' | head -1)
          [ -n "$ZIP" ] || { echo "::error::universal updater ZIP missing"; exit 1; }
          EXTRACTED="$RUNNER_TEMP/codepilot-universal-intel"
          mkdir -p "$EXTRACTED"
          ditto -x -k "$ZIP" "$EXTRACTED"
          APP=$(find "$EXTRACTED" -name 'CodePilot.app' -type d | head -1)
          [ -n "$APP" ] || { echo "::error::CodePilot.app missing from universal ZIP"; exit 1; }
          node scripts/verify-electron-main-health.mjs "$APP/Contents/MacOS/CodePilot"

  release:
    # Only on a `v*` tag push, after macOS/Windows updater assets and every
    # Linux manual installer pass their platform gates.
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-macos, verify-macos-intel-abi, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify GitHub single-trust-root prerequisites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMMUTABLE_RELEASES_CONFIRMED_AT: ${{ vars.CODEPILOT_IMMUTABLE_RELEASES_CONFIRMED_AT }}
          RULESETS_CONFIRMED_STATE: ${{ vars.CODEPILOT_RULESETS_CONFIRMED_STATE }}
        run: |
          set -euo pipefail
          node scripts/verify-immutable-release-ack.mjs "$IMMUTABLE_RELEASES_CONFIRMED_AT"

          RULESETS="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true&per_page=100" | jq 'add')"
          mapfile -t MAIN_IDS < <(printf '%s' "$RULESETS" | jq -r '.[] | select(.name == "main" and .target == "branch" and .enforcement == "active") | .id')
          mapfile -t TAG_IDS < <(printf '%s' "$RULESETS" | jq -r '.[] | select(.name == "stable-release-tags" and .target == "tag" and .enforcement == "active") | .id')
          [ "${#MAIN_IDS[@]}" -eq 1 ] || { echo "::error::expected exactly one active main branch ruleset, found ${#MAIN_IDS[@]}"; exit 1; }
          [ "${#TAG_IDS[@]}" -eq 1 ] || { echo "::error::expected exactly one active stable-release-tags ruleset, found ${#TAG_IDS[@]}"; exit 1; }
          MAIN_ID="${MAIN_IDS[0]}"
          TAG_ID="${TAG_IDS[0]}"

          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${MAIN_ID}" > "$RUNNER_TEMP/codepilot-main-ruleset.json"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${TAG_ID}" > "$RUNNER_TEMP/codepilot-tag-ruleset.json"
          node scripts/verify-github-update-rulesets.mjs \
            "$RUNNER_TEMP/codepilot-main-ruleset.json" \
            "$RUNNER_TEMP/codepilot-tag-ruleset.json" \
            "$RULESETS_CONFIRMED_STATE"

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Audit immutable update graph and prepare checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # Release body is RELEASE_NOTES.md from the repo (must be present for a
          # stable release — no silent fallback).
          [ -f RELEASE_NOTES.md ] || { echo "::error::RELEASE_NOTES.md missing — cannot create stable release"; exit 1; }

          # Merge per-platform checksums into one file.
          echo "## SHA-256 Checksums" > artifacts/SHA256SUMS.txt
          echo "" >> artifacts/SHA256SUMS.txt
          for cs in artifacts/checksums-*.sha256; do
            [ -f "$cs" ] || continue
            cat "$cs" >> artifacts/SHA256SUMS.txt
          done
          echo "=== Combined checksums ==="
          cat artifacts/SHA256SUMS.txt

          # Builder metadata, referenced assets, hashes, sizes and blockmaps
          # must all come from this one downloaded build graph.
          node scripts/verify-update-assets.mjs artifacts "$VERSION" stable distribution

      - name: Attest every release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/CodePilot-*
            artifacts/CodePilot.Setup.*
            artifacts/latest.yml
            artifacts/latest-mac.yml
            artifacts/SHA256SUMS.txt

      - name: Upload immutable graph to a draft, then publish stable Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # The release feed is incomplete without builder metadata/blockmaps.
          FILES=()
          while IFS= read -r f; do
            FILES+=("$f")
          done < <(find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.blockmap" -o -name "latest-mac.yml" -o -name "latest.yml" -o -name "CodePilot.Setup.*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) | sort)
          FILES+=("artifacts/SHA256SUMS.txt")
          echo "=== Release assets ==="
          printf '%s\n' "${FILES[@]}"

          # Keep the release invisible until every asset has uploaded. A failed
          # run leaves a resumable draft instead of a user-visible half feed.
          if EXISTING_DRAFT="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            [ "$EXISTING_DRAFT" = "true" ] || {
              echo "::error::release already exists and is not a draft"
              exit 1
            }
            gh release edit "${GITHUB_REF_NAME}" \
              --title "CodePilot v${VERSION}" \
              --notes-file RELEASE_NOTES.md
            gh release upload "${GITHUB_REF_NAME}" "${FILES[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "CodePilot v${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              "${FILES[@]}"
          fi

          # This is the only visibility transition. If it fails, the complete
          # graph remains a draft and a workflow rerun can safely resume it.
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
